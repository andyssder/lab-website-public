<div class="home-main-content">
  <section class="carousel-wrapper">
    <div id="homeCarousel" class="carousel slide shadow-lg rounded-lg" data-ride="carousel" data-interval="3000" data-pause="hover">
      
      <ol class="carousel-indicators">
        {% for img in include.data.carousel_images %}
          <li data-target="#homeCarousel" data-slide-to="{{ forloop.index0 }}" class="{% if forloop.first %}active{% endif %}"></li>
        {% endfor %}
      </ol>

      <div class="carousel-inner rounded-lg">
        {% for img in include.data.carousel_images %}
          <div class="carousel-item {% if forloop.first %}active{% endif %}">
            <div class="carousel-image-container">
              <div class="blur-background" style="background-image: url('{{ img | relative_url }}');"></div>
              <img src="{{ img | relative_url }}" class="foreground-image" alt="Carousel image">
            </div>
          </div>
        {% endfor %}
      </div>

      <a class="carousel-control-prev" href="#homeCarousel" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#homeCarousel" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
  </section>

  <section class="intro-card-section shadow-sm">
    <div class="intro-body">
      <div class="intro-text">
        {{ include.data.intro_text }}
      </div>
      <div class="intro-graphic">
        <img src="{{ include.data.intro_image | relative_url }}" class="img-fluid rounded" alt="Research Overview">
      </div>
    </div>
  </section>
</div>

<style>
  /* 全局容器 */
  .home-main-content {
    padding: 20px 0 60px 0;
    font-family: var(--global-font-family);
  }

  /* --- 轮播图样式 --- */
  .carousel-wrapper {
    margin-bottom: 4rem;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
  }

  .carousel-image-container {
    height: 480px; 
    position: relative; 
    overflow: hidden;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blur-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    filter: blur(20px) brightness(0.6);
    z-index: 1;
    transform: scale(1.1);
  }

  .foreground-image {
    position: relative;
    z-index: 2;
    height: 100%; 
    width: auto;
    max-width: 100%;
    object-fit: contain;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  .carousel-indicators li {
    background-color: rgba(255, 255, 255, 0.5);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin: 0 5px;
  }
  .carousel-indicators .active {
    background-color: #fff;
  }

  /* --- 简介卡片样式 (去蓝条版) --- */
  .intro-card-section {
    position: relative;
    background: #ffffff;
    border-radius: 8px;
    /* 调整 Padding 使其看起来均衡 */
    padding: 3rem; 
    margin-top: 20px;
    display: block; /* 移除 flex，让内容自然流式布局 */
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* 已移除 .intro-decoration 样式 */

  .intro-body {
    width: 100%;
    max-width: 900px; /* 限制文字最大宽度，防止单行太长阅读困难 */
    margin: 0 auto;   /* 居中 */
  }

  .intro-text {
    font-size: 1.15rem;
    line-height: 1.8;
    color: var(--global-text-color);
    text-align: justify;
    margin-bottom: 3rem;
    font-weight: 400;
  }

  .intro-graphic {
    text-align: center;
    padding: 10px;
  }

  .intro-graphic img {
    max-width: 85%;
    height: auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .carousel-image-container {
      height: 280px;
    }
    .intro-card-section {
      padding: 2rem 1.5rem;
    }
    .intro-text {
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .intro-graphic img {
      max-width: 100%;
    }
  }
</style>
