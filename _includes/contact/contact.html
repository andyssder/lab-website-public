<div class="contact-container">
  <div class="contact-image-wrapper">
    <img src="{{ include.info.image | relative_url }}" class="img-fluid rounded z-depth-1" alt="lab building">
  </div>

  <div class="contact-text-wrapper">
    <p class="contact-name">{{ include.info.name }}</p>
    <p>{{ include.info.institute }}</p>
    <p>{{ include.info.school }}</p>
    <p>Email: <a href="mailto:{{ include.info.email }}">{{ include.info.email }}</a></p>
  </div>
</div>

<style>
  .contact-container {
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* 对齐原图：文字靠左 */
  }

  .contact-image-wrapper {
    width: 100%;
    margin-bottom: 1.5rem;
    text-align: center; /* 图片居中显示 */
  }

  .contact-image-wrapper img {
    /* 核心调整：限制最大高度为屏幕高度的 50%，确保不翻页 */
    max-height: 50vh; 
    width: auto;
    object-fit: contain;
  }

  .contact-text-wrapper {
    font-size: 1rem; /* 稍微调小一点，更接近原图比例 */
    line-height: 1.4;
    color: var(--global-text-color);
    width: 100%;
    padding-left: 5px;
  }

  .contact-text-wrapper p {
    margin-bottom: 0.1rem; /* 极窄行间距，还原图片效果 */
  }

  .contact-name {
    font-weight: 500;
    margin-bottom: 0.3rem !important;
  }

  /* 针对窄屏幕（手机）的适配 */
  @media (max-width: 576px) {
    .contact-image-wrapper img {
      max-height: 40vh; /* 手机上图片占高进一步减小 */
    }
    .contact-text-wrapper {
      font-size: 0.95rem;
    }
  }
</style>
